<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Optimization Runs Gallery</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>Gallery</h1>
    <nav>
      <span id="current-runs-dir-label" style="font-size:0.85rem; color:#aaa;"></span>
      <button type="button" id="change-runs-dir-btn">Change runs directory</button>
      <a href="/favorites">Hearts</a>
      <a href="/stars">Stars</a>
    </nav>
  </header>
  <section class="controls">
    <form id="filter-form">
      <label>Base Directory:
        <select name="subdir" id="subdir-select">
          <option value="">Loading subdirectories...</option>
        </select>
      </label>
      <label>Scene:
        <select name="scene" id="scene-select" required disabled>
          <option value="" disabled selected>Select a directory first</option>
        </select>
      </label>
      <label>Target Prompt:
        <select name="target_prompt" id="prompt-select" required disabled>
          <option value="" disabled selected>Select a scene first</option>
        </select>
      </label>
      <label>Loss Model:
        <select name="loss_model" id="loss-model-select" required disabled>
          <option value="" disabled selected>Select a scene first</option>
        </select>
      </label>
      <label>Reference Image:
        <select name="reference_image" id="ref-image-select" disabled>
          <option value="" disabled selected>Select a scene first</option>
        </select>
      </label>
      <label style="margin-left:12px;">
        <input type="checkbox" id="include-first-iter" />
        Show first-iteration images
      </label>
      <label style="margin-left:12px;">
        <input type="checkbox" id="group-by-iteration" />
        Group by iteration and batch item
      </label>
      <button type="submit" id="load-btn" disabled>Load</button>
    </form>
  </section>
  <p id="status"></p>
  <section id="grid" class="image-grid"></section>

  <template id="image-card-template">
    <div class="img-card" tabindex="0">
      <div class="heart-toggle" title="Toggle Heart">♡</div>
      <div class="star-toggle" title="Toggle Star">☆</div>
      <a class="meta-json" title="View full JSON metadata" target="_blank" rel="noopener">JSON</a>
      <img />
    </div>
  </template>

  <div id="modal" class="modal" hidden>
    <div class="modal-content">
      <button class="close-btn" id="modal-close" aria-label="Close">✕</button>
      <img id="modal-image" />
      <div class="modal-meta">
        <pre id="modal-caption"></pre>
        <div class="modal-actions">
          <button id="modal-heart-btn" class="heart-btn" title="Toggle Heart">♡</button>
          <button id="modal-star-btn" class="star-btn" title="Toggle Star">☆</button>
          <button id="copy-path-btn">Copy Image Path</button>
        </div>
      </div>
    </div>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>

  <div id="runs-dir-setup-overlay" class="startup-overlay" hidden>
    <div class="startup-card">
      <h2>Choose the runs directory</h2>
      <p>Enter the absolute path to the runs folder, or a path relative to the repository root.</p>
      <form id="runs-dir-form">
        <label for="runs-dir-input">Runs directory</label>
        <input id="runs-dir-input" name="runs_dir" type="text" autocomplete="off" spellcheck="false" placeholder="/path/to/runs" />
        <div class="startup-actions" style="display:flex; justify-content:space-between; align-items:center; margin-top:1rem;">
          <button type="button" id="runs-dir-reset-btn" style="background:#2a2a2a; color:#ccc;">Reset to Default</button>
          <div style="display:flex; gap:0.5rem;">
            <button type="button" id="runs-dir-cancel-btn" style="background:#333;">Cancel</button>
            <button type="submit">Save and continue</button>
          </div>
        </div>
      </form>
      <p id="runs-dir-error" class="startup-error" aria-live="polite"></p>
    </div>
  </div>

  <script src="/static/shared.js"></script>
  <script src="/static/gallery.js"></script>
</body>
</html>
